[package]
name = "screen-platform"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["full-platform"]
full-platform = ["ffmpeg-media"]
flat-panel-metal = []
ffmpeg-media = ["dep:ffmpeg-next"]

[dependencies]
ffmpeg-next = { version = "8.1.0", optional = true, default-features = false, features = ["codec", "format", "software-scaling"] }
rayon = "1.11"
screen-color = { path = "../screen-color" }
screen-camera = { path = "../screen-camera" }
screen-application = { path = "../screen-application" }
screen-contracts = { path = "../screen-contracts" }
screen-cover = { path = "../screen-cover" }
screen-geometry = { path = "../screen-geometry" }
screen-media = { path = "../screen-media" }
screen-panel = { path = "../screen-panel" }
screen-sensor = { path = "../screen-sensor" }

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.33"

[dev-dependencies]
half = "2.7.1"
