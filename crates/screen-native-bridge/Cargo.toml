[package]
name = "screen-native-bridge"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib"]

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
screen-application = { path = "../screen-application" }
screen-camera = { path = "../screen-camera" }
screen-contracts = { path = "../screen-contracts" }
screen-cover = { path = "../screen-cover" }
screen-geometry = { path = "../screen-geometry" }
screen-panel = { path = "../screen-panel" }
screen-platform = { path = "../screen-platform", default-features = false, features = ["flat-panel-metal"] }
screen-sensor = { path = "../screen-sensor" }

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.33"
