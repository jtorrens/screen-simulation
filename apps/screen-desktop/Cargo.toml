[package]
name = "screen-desktop"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
rfd = { version = "0.17.2", default-features = false }
slint = { version = "1.17.1", default-features = false, features = ["accessibility", "backend-winit", "compat-1-2", "renderer-femtovg-wgpu", "std"] }
screen-application = { path = "../../crates/screen-application" }
screen-color = { path = "../../crates/screen-color" }
screen-contracts = { path = "../../crates/screen-contracts" }
screen-geometry = { path = "../../crates/screen-geometry" }
screen-media = { path = "../../crates/screen-media" }
screen-panel = { path = "../../crates/screen-panel" }
screen-persistence = { path = "../../crates/screen-persistence" }
screen-platform = { path = "../../crates/screen-platform" }

[build-dependencies]
slint-build = "1.17.1"
