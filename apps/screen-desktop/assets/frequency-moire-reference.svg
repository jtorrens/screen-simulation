<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160" shape-rendering="crispEdges">
  <defs>
    <pattern id="lp1" width="2" height="2" patternUnits="userSpaceOnUse"><rect width="1" height="2" fill="#050505"/><rect x="1" width="1" height="2" fill="#fafafa"/></pattern>
    <pattern id="lp2" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="2" height="4" fill="#050505"/><rect x="2" width="2" height="4" fill="#fafafa"/></pattern>
    <pattern id="lp3" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="3" height="6" fill="#050505"/><rect x="3" width="3" height="6" fill="#fafafa"/></pattern>
    <pattern id="lp4" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="4" height="8" fill="#050505"/><rect x="4" width="4" height="8" fill="#fafafa"/></pattern>
    <pattern id="lp6" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="6" height="12" fill="#050505"/><rect x="6" width="6" height="12" fill="#fafafa"/></pattern>
    <pattern id="lp8" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="8" height="16" fill="#050505"/><rect x="8" width="8" height="16" fill="#fafafa"/></pattern>
    <pattern id="rgb1" width="3" height="3" patternUnits="userSpaceOnUse"><rect width="1" height="3" fill="#ff0000"/><rect x="1" width="1" height="3" fill="#00ff00"/><rect x="2" width="1" height="3" fill="#0000ff"/></pattern>
    <pattern id="cmy2" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="2" height="6" fill="#00ffff"/><rect x="2" width="2" height="6" fill="#ff00ff"/><rect x="4" width="2" height="6" fill="#ffff00"/></pattern>
    <linearGradient id="gray" x1="0" x2="1"><stop offset="0" stop-color="#000000"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
    <linearGradient id="red" x1="0" x2="1"><stop offset="0" stop-color="#000000"/><stop offset="1" stop-color="#ff0000"/></linearGradient>
    <linearGradient id="green" x1="0" x2="1"><stop offset="0" stop-color="#000000"/><stop offset="1" stop-color="#00ff00"/></linearGradient>
    <linearGradient id="blue" x1="0" x2="1"><stop offset="0" stop-color="#000000"/><stop offset="1" stop-color="#0000ff"/></linearGradient>
    <path id="wedge" d="M0 0 L-21.4 -490 L21.4 -490 Z" fill="#050505"/>
