    <rect x="260" y="28" width="128" height="1" fill="#fff"/><rect x="260" y="58" width="128" height="2" fill="#fff"/>
    <rect x="260" y="90" width="128" height="3" fill="#fff"/><rect x="260" y="124" width="128" height="4" fill="#fff"/>
    <g transform="translate(480 28)">
      <rect width="128" height="128" fill="#000"/><rect x="1" y="1" width="126" height="126" fill="#fff"/>
      <rect x="16" y="16" width="96" height="96" fill="#000"/><rect x="17" y="17" width="94" height="94" fill="#fff"/>
      <rect x="32" y="32" width="64" height="64" fill="#000"/><rect x="33" y="33" width="62" height="62" fill="#fff"/>
    </g>
    <text x="660" y="108" font-family="Menlo, Monaco, monospace" font-size="26" fill="#f5f5f5">1  2  3  4  6  8 px · exact authored marks · neutral 50% surround</text>
  </g>
